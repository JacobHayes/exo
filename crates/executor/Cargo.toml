[package]
name = "executor"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
aws-agentcore = ["exoharness/aws-agentcore"]
firecracker = ["exoharness/firecracker"]
# Passthrough so binaries that offer the keychain secret backend (the CLI) can
# opt in without every consumer linking the keyring dependency chain.
apple-keychain = ["exoharness/apple-keychain"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22.1"
boa_engine = "0.20.0"
braintrust-llm-router.workspace = true
braintrust-sdk-rust.workspace = true
bytes.workspace = true
chrono.workspace = true
cost = { path = "../cost" }
exoharness = { path = "../exoharness", features = ["basic-backend"] }
futures.workspace = true
lingua.workspace = true
# Deterministic-simulation instrumentation (buggify/sometimes/always). Every
# macro is a no-op outside a Patina run, so production builds are unaffected.
patina-dst = { git = "https://github.com/JacobHayes/patina.git", rev = "c7e9c9fbb1e5a40cd01210b0a1f494a3c4fdfa2c" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
futures.workspace = true
tempfile = "3.23.0"
